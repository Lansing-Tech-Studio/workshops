---
layout: default
---

<div class="coming-soon-wrapper">
  <div class="coming-soon-badge">Coming Soon</div>
  <h1 class="coming-soon-title">{{ page.title }}</h1>
  <p class="coming-soon-tagline">{{ page.tagline | default: "This workshop is being built. Check back soon!" }}</p>

  {% if page.preview %}
  <div class="coming-soon-preview">
    {{ page.preview | markdownify }}
  </div>
  {% endif %}
</div>

<style>
  .coming-soon-wrapper {
    text-align: center;
    padding: 4rem 2rem;
    max-width: 600px;
    margin: 0 auto;
  }

  .coming-soon-badge {
    display: inline-block;
    background-color: var(--accent-color);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }

  .coming-soon-title {
    font-size: 2rem;
    margin: 0 0 1rem;
  }

  .coming-soon-tagline {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin: 0 0 2rem;
  }

  .coming-soon-preview {
    text-align: left;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    font-size: 0.95rem;
  }

  .coming-soon-preview ul {
    margin: 0.5rem 0 0;
    padding-left: 1.25rem;
  }

  .coming-soon-preview li {
    margin-bottom: 0.4rem;
  }
</style>
