<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Hub</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      text-align: center;
      padding: 4rem;
    }

    .label {
      font-size: 1.5rem;
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    .value {
      font-size: 8rem;
      font-weight: 200;
      line-height: 1;
    }

    .unit {
      font-size: 3rem;
      opacity: 0.5;
    }

    .row {
      display: flex;
      gap: 4rem;
    }

    .stale .value {
      color: #ff8866;
    }

    .footer {
      margin-top: 3rem;
      font-size: 1rem;
      opacity: 0.4;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="row">
      <div>
        <div class="label">Temperature</div>
        <div class="value"><span id="temp">--</span><span class="unit">&deg;C</span></div>
      </div>
      <div>
        <div class="label">Humidity</div>
        <div class="value"><span id="humidity">--</span><span class="unit">%</span></div>
      </div>
    </div>
    <div class="footer" id="status">Connecting...</div>
  </div>
  <script>
    // CHANGE THIS to the IP printed by your ESP32 on the Serial Monitor.
    // You can also override it by appending ?ip=192.168.1.42 to the URL.
    const DEFAULT_IP = "192.168.1.134";
    const params = new URLSearchParams(window.location.search);
    const ip = params.get("ip") || DEFAULT_IP;
    const ESP32_URL = `http://${ip}/api/sensor`;

    const tempEl = document.getElementById("temp");
    const humEl = document.getElementById("humidity");
    const statusEl = document.getElementById("status");

    async function update() {
      try {
        const res = await fetch(ESP32_URL, { cache: "no-store" });
        const data = await res.json();
        if (data.status === "ok") {
          tempEl.textContent = data.temp_c.toFixed(1);
          humEl.textContent = data.humidity.toFixed(1);
          const stale = data.age_ms > 10000;
          document.body.classList.toggle("stale", stale);
          statusEl.textContent = stale
            ? `Last reading ${Math.round(data.age_ms / 1000)}s ago`
            : `Live from ${ip}`;
        } else {
          statusEl.textContent = data.message || "Sensor not ready";
        }
      } catch (e) {
        statusEl.textContent = `Cannot reach ${ip} — check WiFi and IP`;
        console.error("Fetch failed:", e);
      }
    }

    update();
    setInterval(update, 2000);
  </script>
</body>

</html>
